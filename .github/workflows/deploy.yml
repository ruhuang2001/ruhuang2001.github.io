name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          
      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra

      - name: Setup pnpm
        run: npm i -g pnpm@10.28.0

      - name: Copy index.html to dist
        run: |
          mkdir -p dist
          cp index.html dist/

      # 构建 aigc-dev 演示文稿
      - name: Install dependencies for aigc-dev
        run: |
          cd talks/aigc-dev
          npm ci

      - name: Install Chromium for aigc-dev exports
        run: |
          cd talks/aigc-dev
          npx playwright install --with-deps chromium

      - name: Build aigc-dev
        run: |
          cd talks/aigc-dev
          npm run build
          npx slidev export --output screenshots --format png --wait-until domcontentloaded --wait 1000 --timeout 30000
          
          mkdir -p ../../dist/talks/aigc-dev
          cp -r dist/* ../../dist/talks/aigc-dev/
          mkdir -p ../../dist/talks/aigc-dev/styles
          cp styles/index.css ../../dist/talks/aigc-dev/styles/

          mkdir -p ../../dist/talks/aigc-dev/screenshots
          cp screenshots/1.png ../../dist/talks/aigc-dev/screenshots/

      # 构建 from-chat-to-agent 演示文稿
      - name: Install dependencies for from-chat-to-agent
        run: |
          cd talks/from-chat-to-agent
          pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          cd talks/from-chat-to-agent
          pnpm exec playwright install --with-deps chromium

      - name: Build from-chat-to-agent
        run: |
          cd talks/from-chat-to-agent
          pnpm run build
          cp dist/index.html dist/1.html

          mkdir -p ../../dist/talks/from-chat-to-agent
          cp -r dist/* ../../dist/talks/from-chat-to-agent/
          mkdir -p ../../dist/talks/from-chat-to-agent/styles
          cp styles/index.css styles/variant.css ../../dist/talks/from-chat-to-agent/styles/
          cp dist/index.html ../../dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
